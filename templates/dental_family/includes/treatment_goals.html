<section {% if homepage %}id="smile-goals"{% endif %} class="section wrap smile-goals-section" aria-labelledby="smile-goals-heading">
<div class="section-heading"><div><div class="eyebrow">YOUR SMILE, YOUR GOALS</div><h2 id="smile-goals-heading">What would you like<br/>to <em>improve?</em></h2></div><p>A small change or a fresh start. Find the care that feels right for you. Choose a goal to explore your options.</p></div>
<div class="services-grid">{% for goal in goals %}
<a class="treatment-card--card" data-lift="" href="{{ goal.url }}">
<div class="treatment-card--image"><img src="{{ goal.image }}" alt="" width="360" height="240" loading="lazy" decoding="async" style="position:absolute;height:100%;width:100%;inset:0;object-position:center"></div>
<div class="treatment-card--content"><h3>{{ goal.title }}</h3><span class="treatment-card--action">Explore treatments <span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span></div>
</a>{% endfor %}</div>
</section>
